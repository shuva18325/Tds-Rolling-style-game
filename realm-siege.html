 * Procedural low-poly art: shade()/facet() helpers, 26 distinct animated tower
 * silhouettes, and cached enemy walk-cycle sprite sheets (offscreen canvases
 * rendered once per motif, then blitted — the key to 200 enemies at 60 FPS).
 *
 * PURELY PRESENTATIONAL. No sim state is read or written here.
 * ========================================================================= */
(function () {
  'use strict';
  const RS = (window.RS = window.RS || {});
  const A = RS.art, TAU = Math.PI * 2;
  const shade = A.shade;

  function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
  function facet(ctx, pts, color, rim) {
    poly(ctx, pts); ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 1; ctx.stroke();
    if (rim) { ctx.strokeStyle = rim; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); ctx.stroke(); }
  }
  function circ(ctx, x, y, r, color, rim) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = color; ctx.fill(); if (rim) { ctx.strokeStyle = rim; ctx.lineWidth = 1; ctx.stroke(); } }

  /* ============================ TOWERS =============================== */
  const Sil = {};

  // Rarity dais: faceted octagon platform + glow + ring.
  function dais(ctx, x, y, s, def, o) {
    const pal = RS.rarityPal(def.rarity);
    ctx.save();
    // glow
    if (pal.glowStr > 0.1) {
      const gr = ctx.createRadialGradient(x, y, 2, x, y, 22 * s);
      const gc = pal.prismatic ? A.prismatic(o.t, def._ph || 0) : pal.glow;
      gr.addColorStop(0, A.alpha(gc, pal.glowStr)); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 22 * s, 0, TAU); ctx.fill();
    }
    // platform
    const r = 14 * s;
    facet(ctx, [[x - r, y], [x - r * 0.6, y - 5 * s], [x + r * 0.6, y - 5 * s], [x + r, y], [x + r * 0.6, y + 4 * s], [x - r * 0.6, y + 4 * s]], A.mul(pal.dais, 1.1));
    facet(ctx, [[x - r, y], [x - r * 0.6, y + 4 * s], [x + r * 0.6, y + 4 * s], [x + r, y], [x + r * 0.7, y + 7 * s], [x - r * 0.7, y + 7 * s]], A.mul(pal.dais, 0.7));
    // rarity ring
    ctx.lineWidth = def._asc ? 2.5 : 1.6;
    ctx.strokeStyle = pal.prismatic ? A.prismatic(o.t, 1) : pal.base;
    ctx.beginPath(); ctx.ellipse(x, y, r, 5 * s, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // helper metal/wood ramps
  const woodL = () => RS.RAMP.timber.light, woodM = () => RS.RAMP.timber.mid, woodD = () => RS.RAMP.timber.shadow;

  // --- COMMON ---
  Sil.militia = (ctx, r, a, p) => { // spear + round shield blocker
    facet(ctx, [[-7, 10], [-5, -4], [0, -8], [5, -4], [7, 10]], r.mid, r.rim);
    circ(ctx, -6, 2, 5, RS.RAMP.iron.mid, RS.RAMP.iron.rim); // shield
    ctx.strokeStyle = woodM(); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, 12); ctx.lineTo(9 + p.lunge, -14); ctx.stroke();
    facet(ctx, [[9 + p.lunge, -16], [11 + p.lunge, -12], [7 + p.lunge, -12]], RS.RAMP.iron.light);
    circ(ctx, 0, -9, 3.5, RS.RAMP.flesh.mid); };
  Sil.archer = (ctx, r, a, p) => { // bowman drawing a bow
    facet(ctx, [[-5, 10], [-4, -6], [4, -6], [5, 10]], RS.RAMP.leather.mid, RS.RAMP.leather.rim);
    circ(ctx, 0, -9, 3.5, RS.RAMP.flesh.mid);
    ctx.save(); ctx.rotate(a);
    const draw = p.draw; // 0..1 bow tension
    ctx.strokeStyle = woodL(); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(8, 0, 8, -1.4, 1.4); ctx.stroke();
    ctx.strokeStyle = '#d8cba0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8 + Math.cos(-1.4) * 8, Math.sin(-1.4) * 8); ctx.lineTo(2 - draw * 3, 0); ctx.lineTo(8 + Math.cos(1.4) * 8, Math.sin(1.4) * 8); ctx.stroke();
    if (draw > 0.1) { ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(2 - draw * 3, 0); ctx.lineTo(14, 0); ctx.stroke(); }
    ctx.restore(); };
  Sil.brazier = (ctx, r, a, p) => { // fire bowl
    facet(ctx, [[-3, 12], [-4, 2], [4, 2], [3, 12]], RS.RAMP.iron.shadow);
    facet(ctx, [[-6, 2], [6, 2], [4, -2], [-4, -2]], RS.RAMP.iron.mid, RS.RAMP.iron.rim);
    const f = 3 + Math.sin(p.t * 8) * 1.5;
    circ(ctx, 0, -3, 5 + f * 0.3, '#e8722c'); circ(ctx, 0, -5, 3 + f * 0.3, '#f5c542'); };
  Sil.slinger = (ctx, r, a, p) => { // sling + rock
    facet(ctx, [[-8, 11], [-6, 4], [6, 4], [8, 11]], woodM(), woodL());
    ctx.save(); ctx.rotate(-0.5 + p.recoil * 0.5); ctx.strokeStyle = woodL(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-2, 4); ctx.lineTo(6, -12); ctx.stroke();
    circ(ctx, 6, -12, 4, RS.RAMP.stone.mid, RS.RAMP.stone.rim); ctx.restore(); };
  Sil.watchtower = (ctx, r, a, p) => { // tall spotter tower
    facet(ctx, [[-5, 12], [-4, -12], [4, -12], [5, 12]], woodM(), woodL());
    facet(ctx, [[-6, -12], [6, -12], [3, -18], [-3, -18]], r.mid, r.rim);
    circ(ctx, 0, -14, 2, RS.RAMP.iron.light); };
  // --- UNCOMMON ---
  Sil.crossbow = (ctx, r, a, p) => {
    facet(ctx, [[-5, 10], [-4, -5], [4, -5], [5, 10]], RS.RAMP.leather.mid);
    circ(ctx, 0, -8, 3.2, RS.RAMP.flesh.mid);
    ctx.save(); ctx.rotate(a); facet(ctx, [[-2, -2], [14 - p.recoil * 4, -2], [14 - p.recoil * 4, 2], [-2, 2]], RS.RAMP.iron.mid, RS.RAMP.iron.rim);
    ctx.strokeStyle = woodD(); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(4, 6); ctx.stroke(); ctx.restore(); };
  Sil.menatarms = (ctx, r, a, p) => { // big shield + sword
    facet(ctx, [[-8, 11], [-6, -5], [0, -9], [6, -5], [8, 11]], r.mid, r.rim);
    facet(ctx, [[-9, -3], [-3, -6], [-3, 8], [-9, 5]], RS.RAMP.steel.mid, RS.RAMP.steel.rim); // shield
    ctx.strokeStyle = RS.RAMP.steel.light; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(11 + p.lunge, -12); ctx.stroke();
    circ(ctx, 0, -10, 3.5, RS.RAMP.iron.mid); };
  Sil.hedgewizard = (ctx, r, a, p) => { // robed, staff orb
    facet(ctx, [[0, -14], [8, 12], [-8, 12]], RS.RAMP.cloth.mid, RS.RAMP.cloth.rim);
    facet(ctx, [[0, -14], [-3, -6], [3, -6]], A.mul('#4a2f6a', 1.2));
    ctx.strokeStyle = woodM(); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(7, 12); ctx.lineTo(9, -12); ctx.stroke();
    circ(ctx, 9, -13, 3 + p.charge * 2, '#c79bff', '#e0c0ff'); };
  Sil.ballista = (ctx, r, a, p) => {
    facet(ctx, [[-9, 11], [-7, 3], [7, 3], [9, 11]], woodM(), woodL());
    ctx.save(); ctx.rotate(a); ctx.strokeStyle = woodL(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-2, -9); ctx.quadraticCurveTo(6 - p.recoil * 3, -1, -2, 9); ctx.stroke();
    facet(ctx, [[-2 - p.recoil * 5, -1.5], [12 - p.recoil * 5, -1.5], [15 - p.recoil * 5, 0], [12 - p.recoil * 5, 1.5], [-2 - p.recoil * 5, 1.5]], RS.RAMP.iron.mid); ctx.restore(); };
  // --- RARE ---
  Sil.longbow = (ctx, r, a, p) => { // tall archer, long yew bow
    facet(ctx, [[-4, 12], [-4, -10], [4, -10], [4, 12]], RS.RAMP.leather.mid, RS.RAMP.leather.rim);
    circ(ctx, 0, -13, 3.2, RS.RAMP.flesh.mid);
    ctx.save(); ctx.rotate(a); ctx.strokeStyle = woodL(); ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(6, 0, 13, -1.2, 1.2); ctx.stroke();
    const d = p.draw; ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(6 + Math.cos(-1.2) * 13, Math.sin(-1.2) * 13); ctx.lineTo(0 - d * 4, 0); ctx.lineTo(6 + Math.cos(1.2) * 13, Math.sin(1.2) * 13); ctx.stroke();
    if (d > 0.1) { ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0 - d * 4, 0); ctx.lineTo(18, 0); ctx.stroke(); } ctx.restore(); };
  Sil.knight = (ctx, r, a, p) => { // mounted knight
    facet(ctx, [[-10, 10], [-8, 3], [8, 3], [10, 10]], RS.RAMP.steel.shadow); // horse body
    facet(ctx, [[-8, 3], [-6, -8], [-2, -8], [-2, 3]], r.mid, r.rim);
    circ(ctx, -5, -10, 3, RS.RAMP.steel.mid);
    ctx.strokeStyle = RS.RAMP.steel.light; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(12 + p.lunge, -12); ctx.stroke(); };
  Sil.cleric = (ctx, r, a, p) => { // banner + halo
    ctx.strokeStyle = woodM(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -16); ctx.stroke();
    const w = Math.sin(p.t * 3) * 2;
    facet(ctx, [[0, -16], [14, -13 + w], [13, -5 - w], [0, -6]], '#e8dcc0', '#fff');
    facet(ctx, [[3, -13], [8, -11], [3, -9]], '#d9a441');
    ctx.strokeStyle = A.alpha('#f5e6a8', 0.6 + Math.sin(p.t * 2) * 0.2); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, -14, 5, 0, TAU); ctx.stroke(); };
  Sil.trebuchet = (ctx, r, a, p) => { // big A-frame
    facet(ctx, [[-11, 12], [-3, -12], [-1, -12], [-7, 12]], woodM(), woodL());
    facet(ctx, [[11, 12], [3, -12], [1, -12], [7, 12]], woodD());
    const arm = -0.7 + p.recoil * 2.2;
    ctx.save(); ctx.translate(0, -11); ctx.rotate(arm); ctx.strokeStyle = woodL(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(12, 0); ctx.stroke();
    facet(ctx, [[-13, -3], [-8, -3], [-8, 4], [-13, 4]], RS.RAMP.stone.shadow); // counterweight
    if (p.recoil < 0.5) circ(ctx, 12, 3, 3.5, RS.RAMP.stone.mid); ctx.restore(); };
  // --- EPIC ---
  Sil.templar = (ctx, r, a, p) => { // holy knight, tower shield + cross
    facet(ctx, [[-7, 11], [-6, -6], [0, -10], [6, -6], [7, 11]], r.mid, r.rim);
    facet(ctx, [[-9, -6], [-2, -8], [-2, 9], [-9, 7]], '#e8dcc0', '#fff');
    ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-5.5, -5); ctx.lineTo(-5.5, 5); ctx.moveTo(-8, 0); ctx.lineTo(-3, 0); ctx.stroke();
    ctx.strokeStyle = '#f5e6a8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, 4); ctx.lineTo(11 + p.lunge, -12); ctx.stroke();
    circ(ctx, 0, -11, 3.4, RS.RAMP.steel.mid); };
  Sil.frostmagus = (ctx, r, a, p) => { // frost-robed with icy orb
    facet(ctx, [[0, -14], [8, 12], [-8, 12]], RS.RAMP.ice.shadow, RS.RAMP.ice.rim);
    facet(ctx, [[0, -14], [-3, -5], [3, -5]], '#bfeaf5');
    circ(ctx, 0, -6, 4 + Math.sin(p.t * 2) * 0.6, '#8fd4e8', '#e0f8ff');
    for (let i = 0; i < 3; i++) { const ang = p.t * 1.2 + i * 2.1; circ(ctx, Math.cos(ang) * 10, -6 + Math.sin(ang) * 4, 1.4, '#e0f8ff'); } };
  Sil.bombard = (ctx, r, a, p) => { // heavy cannon
    facet(ctx, [[-9, 12], [-7, 4], [7, 4], [9, 12]], RS.RAMP.iron.shadow);
    circ(ctx, -7, 10, 3, RS.RAMP.iron.mid); circ(ctx, 7, 10, 3, RS.RAMP.iron.mid);
    ctx.save(); ctx.translate(-p.recoil * 5 * Math.cos(a), -p.recoil * 5 * Math.sin(a)); ctx.rotate(a);
    facet(ctx, [[-4, -5], [12, -6], [14, 0], [12, 6], [-4, 5]], RS.RAMP.steel.mid, RS.RAMP.steel.rim);
    circ(ctx, 14, 0, 3, '#1a1a1a'); ctx.restore(); };
  Sil.falconer = (ctx, r, a, p) => { // falconer with raised gauntlet
    facet(ctx, [[-5, 11], [-4, -6], [4, -6], [5, 11]], RS.RAMP.leather.mid, r.rim);
    circ(ctx, 0, -9, 3.2, RS.RAMP.flesh.mid);
    facet(ctx, [[6, -8], [12, -12], [10, -6]], r.mid); // falcon on arm
    circ(ctx, 11, -11, 2, r.light); };
  // --- LEGENDARY ---
  Sil.paladin = (ctx, r, a, p) => { // champion, glowing sword + aura crest
    facet(ctx, [[-8, 12], [-6, -7], [0, -12], [6, -7], [8, 12]], r.mid, r.rim);
    facet(ctx, [[-10, -5], [-2, -9], [-2, 10], [-10, 8]], '#e8dcc0', '#fff');
    ctx.save(); ctx.rotate(-0.3 - p.lunge * 0.4); ctx.strokeStyle = '#fff2c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(9, -18); ctx.stroke();
    ctx.strokeStyle = A.alpha('#ffcb5a', 0.7); ctx.lineWidth = 5; ctx.stroke(); ctx.restore();
    circ(ctx, 0, -12, 3.6, RS.RAMP.gold.mid, RS.RAMP.gold.rim); };
  Sil.archmage = (ctx, r, a, p) => { // floating crystalline spire + orbiting runes
    const fl = Math.sin(p.t * 1.5) * 2;
    facet(ctx, [[-6, 12 + fl], [0, -18 + fl], [6, 12 + fl]], A.mul('#6a3fa5', 1.1), '#c79bff');
    facet(ctx, [[0, -18 + fl], [-3, -6 + fl], [3, -6 + fl]], '#c79bff');
    circ(ctx, 0, -8 + fl, 3 + p.charge * 2, '#e0c0ff', '#fff');
    for (let i = 0; i < 4; i++) { const ang = p.t * RS.ANIM.runeRotate * TAU + i * 1.57; circ(ctx, Math.cos(ang) * 12, -8 + Math.sin(ang) * 5 + fl, 1.6, '#c79bff'); } };
  Sil.engineer = (ctx, r, a, p) => { // siege workshop with gear
    facet(ctx, [[-9, 12], [-9, -4], [9, -4], [9, 12]], woodM(), woodL());
    facet(ctx, [[-9, -4], [9, -4], [6, -9], [-6, -9]], RS.RAMP.iron.shadow);
    const g = p.t * 1.5; ctx.save(); ctx.translate(2, 2); ctx.rotate(g); for (let i = 0; i < 6; i++) { const ang = i / 6 * TAU; facet(ctx, [[Math.cos(ang) * 4, Math.sin(ang) * 4], [Math.cos(ang + 0.3) * 7, Math.sin(ang + 0.3) * 7], [Math.cos(ang + 0.6) * 4, Math.sin(ang + 0.6) * 4]], RS.RAMP.iron.mid); } ctx.restore();
    circ(ctx, 2, 2, 3, RS.RAMP.iron.light); };
  Sil.wyvernrider = (ctx, r, a, p) => { // small wyvern mount hovering
    const flap = Math.sin(p.t * 6) * 5;
    facet(ctx, [[-16, -2 - flap], [-2, 3], [0, -4], [-4, -6 - flap]], A.mul(r.mid, 0.9), r.rim);
    facet(ctx, [[16, -2 - flap], [2, 3], [0, -4], [4, -6 - flap]], A.mul(r.mid, 0.9), r.rim);
    facet(ctx, [[-6, 6], [6, 6], [3, -3], [-3, -3]], r.mid, r.rim);
    circ(ctx, 5, -2, 3, r.light); circ(ctx, 6, -3, 1, '#e8722c'); };
  // --- MYTHIC ---
  Sil.marshal = (ctx, r, a, p) => { // grand banner + crown
    ctx.strokeStyle = RS.RAMP.gold.mid; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -18); ctx.stroke();
    const w = Math.sin(p.t * 2.5) * 3;
    facet(ctx, [[0, -18], [16, -14 + w], [15, -3 - w], [0, -5]], '#a02c2c', '#d9a441');
    facet(ctx, [[3, -14], [10, -11], [3, -8]], '#d9a441');
    facet(ctx, [[-4, -18], [4, -18], [3, -23], [1, -20], [0, -24], [-1, -20], [-3, -23]], RS.RAMP.gold.light, RS.RAMP.gold.rim); };
  Sil.wyrm = (ctx, r, a, p) => { // coiled 2x2 dragon
    const br = Math.sin(p.t * 1.5) * 1.5;
    facet(ctx, [[-18, 16], [-6, -18 + br], [10, -10], [18, 16]], A.mul(r.mid, 0.85), r.rim);
    facet(ctx, [[-6, -18 + br], [-14, -8], [-2, -6]], A.mul(r.mid, 0.7)); // wing
    facet(ctx, [[10, -10], [22, -14], [18, -4]], A.mul(r.mid, 0.9)); // head
    circ(ctx, 18, -10, 2.5, '#ffcb5a'); circ(ctx, 20, -12, 3 + Math.sin(p.t * 4) * 1.5, '#e8722c'); };
  Sil.lich = (ctx, r, a, p) => { // necromancer, skull staff
    facet(ctx, [[0, -14], [8, 12], [-8, 12]], RS.RAMP.void.mid, '#7b4fb5');
    facet(ctx, [[0, -14], [-3, -6], [3, -6]], '#3a2a4a');
    circ(ctx, 0, -9, 3, RS.RAMP.bone.light);
    ctx.strokeStyle = RS.RAMP.void.shadow; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, 12); ctx.lineTo(9, -14); ctx.stroke();
    circ(ctx, 9, -15, 3, RS.RAMP.bone.mid); circ(ctx, 8, -15, 0.8, '#7bff9f'); circ(ctx, 10.2, -15, 0.8, '#7bff9f'); };
  // --- MYTHIC+ ---
  Sil.grail = (ctx, r, a, p) => { // radiant chalice
    const pr = A.prismatic(p.t, 0);
    facet(ctx, [[-8, -10], [8, -10], [5, 3], [-5, 3]], '#fff', '#fff');
    facet(ctx, [[-3, 3], [3, 3], [4, 12], [-4, 12]], RS.RAMP.gold.mid);
    const g = ctx.createRadialGradient(0, -6, 1, 0, -6, 16); g.addColorStop(0, A.alpha('#fff8d0', 0.9)); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -6, 16, 0, TAU); ctx.fill();
    ctx.strokeStyle = A.alpha('#fff', 0.7 + Math.sin(p.t * 3) * 0.2); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, -6, 13, 0, TAU); ctx.stroke(); };
  Sil.sovereign = (ctx, r, a, p) => { // geometric worldforge construct
    ctx.save(); ctx.rotate(Math.sin(p.t * 0.5) * 0.1);
    facet(ctx, [[-10, -8], [10, -8], [12, 8], [-12, 8]], A.mul('#3a3a44', 1.2), '#8fd4e8');
    facet(ctx, [[-10, -8], [10, -8], [7, -12], [-7, -12]], A.mul('#3a3a44', 1.5));
    ctx.restore();
    const ang = p.t * 0.8; for (let i = 0; i < 3; i++) { const aa = ang + i * 2.09; circ(ctx, Math.cos(aa) * 13, Math.sin(aa) * 8, 2, A.prismatic(p.t, i)); }
    circ(ctx, 0, 0, 4 + Math.sin(p.t * 2) * 1, '#8fd4e8', '#e0f8ff'); };

  function drawTower(ctx, def, x, y, o) {
    o = o || {}; const t = o.t || 0;
    const art = RS.TOWER_ART[def.id] || { sil: 'archer', anim: 'archer' };
    const s = (art.scale || 1) * (o.scale || 1);
    def._ph = def._ph || (Math.abs(hashStr(def.id)) % 100) / 100;
    def._asc = o.ascended;
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.beginPath(); ctx.ellipse(x, y + 13 * s, 15 * s, 5.5 * s, 0, 0, TAU); ctx.fill();
    dais(ctx, x, y + 8 * s, s, def, o);
    // animation params
    const bob = Math.sin(t * RS.ANIM.idleBobHz * TAU + def._ph * TAU) * 1.1;
    const p = {
      t, lunge: 0, recoil: o.atk || 0, draw: 0, charge: 0,
    };
    // per-anim idle/attack shaping
    const atk = o.atk || 0; // 0..1 attack progress
    if (art.anim === 'archer') p.draw = 0.15 + Math.sin(t * 2 + def._ph) * 0.08 + (atk < 0.5 ? atk * 1.6 : (1 - atk) * 0.4);
    if (art.anim === 'mage') p.charge = atk;
    if (art.anim === 'blocker') p.lunge = atk * 3;
    if (art.anim === 'siege') p.recoil = atk;
    const r = RS.rarityRamp(def.rarity);
    ctx.save();
    ctx.translate(x, y - bob);
    if (o.place != null && o.place < 1) { const sc = RS.EASE.easeOutBack(RS.art.clamp(o.place, 0, 1)); ctx.scale(sc, 2 - sc); }
    (Sil[art.sil] || Sil.archer)(ctx, r, o.aim || 0, p);
    ctx.restore();
    // muzzle bloom
    if (atk > 0.55) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (atk - 0.55) * 2; circ(ctx, x + Math.cos(o.aim || 0) * 10, y - 6 + Math.sin(o.aim || 0) * 10, 5, RS.rarityPal(def.rarity).glow); ctx.restore(); }
    // ascension prism overlay
    if (o.ascended) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = A.alpha(RS.rarityPal(def.rarity).prismatic ? A.prismatic(t, 2) : '#fff', 0.4); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 17 * s + Math.sin(t * 3) * 1.5, 0, TAU); ctx.stroke(); ctx.restore(); }
  }

  // Small icon for UI cards/glyphs (static pose, centered).
  function drawTowerIcon(ctx, def, cx, cy, size) {
    ctx.save(); ctx.translate(cx, cy); const sc = size / 44; ctx.scale(sc, sc);
    drawTower(ctx, def, 0, 2, { t: performance.now() / 1000, scale: 1, aim: -0.3, ascended: false });

        if (raised) { c.fillStyle = 'rgba(0,0,0,0.30)'; for (const [x, y] of cells) { this._roundRect(c, x - 6, y + 2, TILE + 12, TILE + 10, 16); c.fill(); } }
        c.fillStyle = ramp.mid; for (const [x, y] of cells) { this._roundRect(c, x - 7, y - 7, TILE + 14, TILE + 14, 16); c.fill(); }
        c.fillStyle = raised ? ramp.light : A.alpha(ramp.light, 0.55); for (const [x, y] of cells) { this._roundRect(c, x - 1, y - 1, TILE + 2, TILE - (raised ? 6 : 2), 12); c.fill(); }
      };
      patch('water', RS.RAMP.water); patch('unbuildable', RS.RAMP.stoneDark);
      patch('highground', RS.RAMP.stone, true); patch('holy', RS.RAMP.holy);
      patch('cursed', RS.RAMP.void); patch('hazard', RS.RAMP.lava);

    }
    _roundRect(c, x, y, w, h, r) {

    _diamond(ctx, x, y, s, stroke) { ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath(); stroke ? ctx.stroke() : ctx.fill(); }

    /* -------------------------- animated tiles ---------------------- */
    _animatedTiles(ctx, m) {

        const k = m.tileKind(col, r); if (k === 'buildable' || k === 'path' || k === 'unbuildable') continue;

        } else if (k === 'holy') {
          const g = ctx.createRadialGradient(cx, cy - 4, 1, cx, cy, 18); g.addColorStop(0, A.alpha('#fff2b0', 0.3 + Math.sin(t * 2 + r) * 0.12)); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, TILE, TILE);

        } else if (k === 'highground') {

    }

    /* ------------------------- range + ghost ------------------------ */
    _rangeAndGhost(ctx, m) {
      const sel = this.selected;

      if (this.showRange && !sel) for (const t of m.towers) if (!t.def.traits.globalAura) this._rangeRing(ctx, t.x, t.y, m._effectiveRange(t), '#ffffff', 0.12);

    }

    /* ------------------------------ towers -------------------------- */
    _towers(ctx, m) {
      const list = m.towers.slice().sort((a, b) => a.y - b.y);

        const v = t.vis || { phase: 0, atkT: 0, atkDur: 0.34, aim: -0.3, placeT: 1 };
        const atk = v.atkDur > 0 ? (v.atkT > 0 ? 1 - v.atkT / v.atkDur : 0) : 0;

        S.drawTower(ctx, t.def, t.x, t.y, { t: this.clock + v.phase, atk, aim: v.aim, ascended: t.ascended, place: v.placeT });
        ctx.restore();
        // status rings

        // blocker hp bar

        // level pips

      }
    }

    _summons(ctx, m) {
      for (const s of m.summons) {
        if (s.kind === 'falcon') { ctx.save(); ctx.translate(s.x, s.y); const f = Math.sin(this.clock * 18) * 3; S.facet(ctx, [[-7, 0], [0, 3], [7, 0], [0, -3 - f]], '#d9cba0', '#fff'); ctx.restore(); }
        else if (s.kind === 'wraith') { ctx.globalAlpha = 0.8; S.circ(ctx, s.x, s.y, 6, A.alpha('#7d5fa0', 0.9), '#9fe0b8'); S.circ(ctx, s.x - 1.5, s.y - 1, 1, '#7bff9f'); S.circ(ctx, s.x + 1.5, s.y - 1, 1, '#7bff9f'); ctx.globalAlpha = 1; }
        else if (s.kind === 'turret') { S.facet(ctx, [[s.x - 6, s.y + 6], [s.x - 6, s.y - 4], [s.x + 6, s.y - 4], [s.x + 6, s.y + 6]], RS.RAMP.iron.mid, RS.RAMP.iron.rim); ctx.save(); ctx.translate(s.x, s.y - 3); ctx.rotate(this.clock); ctx.fillStyle = RS.RAMP.iron.light; ctx.fillRect(-2, -8, 4, 8); ctx.restore(); }
      }
    }

    /* ------------------------------ enemies ------------------------- */
    _enemies(ctx, m) {
      const arr = m.enemies.slice().sort((a, b) => a.y - b.y);
      for (const e of arr) {
        if (!e.alive) continue;
        if (e.isBoss) this._drawBoss(ctx, e); else S.drawEnemy(ctx, e, this.clock);
        this._hpBar(ctx, e);
      }
    }
    _hpBar(ctx, e) {
      const w = e.isBoss ? 46 : 16, hp = Math.max(0, e.hp / e.maxHp);
      const by = e.y - (e.isBoss ? 34 : (RS.Sprites.getSheet(e.def.motif).size * 0.5 + 4));
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - w / 2, by, w, e.isBoss ? 4 : 3);
      ctx.fillStyle = hp > 0.5 ? RS.PALETTE.good : hp > 0.25 ? RS.PALETTE.warn : RS.PALETTE.bad; ctx.fillRect(e.x - w / 2, by, w * hp, e.isBoss ? 4 : 3);
    }
    _drawBoss(ctx, e) {
      // bosses drawn live at big scale with ambient embers

      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + 12, 26, 9, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(e.x, e.y + Math.sin(t * 1.2) * 2); ctx.scale(scale, scale);

      S.facet(ctx, [[-6, -14], [-2, -20], [0, -14]], RS.RAMP.void.shadow); S.facet(ctx, [[6, -14], [2, -20], [0, -14]], RS.RAMP.void.shadow);

    }

    /* ---------------------- sim particles / proj -------------------- */
    _matchParticles(ctx, m) {

      ctx.globalAlpha = 1;
    }
    _projectiles(ctx, m) {
      m.projPool.forEachActive((p) => {
        const col = RS.DMG_COLOR[p.type] || p.color || '#fff';
        // trail streak toward previous direction

    /* ------------------------------ auras --------------------------- */
    _auras(ctx, m) {
      const t = this.clock;

        const tr = src.def.traits; let radius = 0, color = null;
        if (tr.support) { radius = (tr.support.radiusT + ((src._mods && src._mods.auraRadiusT) || 0)) * TILE; color = tr.support.attackSpeedAura ? '#8fd4e8' : (tr.support.healBlockers ? '#7bd070' : '#8fd4e8'); }
        else if (tr.aura) { radius = (tr.aura.radiusT + ((src._mods && src._mods.auraRadiusT) || 0)) * TILE; color = '#ffcb5a'; }
        else if (tr.slowField) { radius = tr.slowField.radiusT * TILE; color = '#8fd4e8'; }
        if (!radius) continue;

        ctx.restore();
      }

    }

    /* ------------------------------ weather ------------------------- */
    _updateWeather(m, dt) {
      const w = m.weather; const cap = 240;
      const spawn = (n, fn) => { for (let i = 0; i < n && this.weatherParts.length < cap; i++) this.weatherParts.push(fn()); };
      const W = this.canvas.width, H = this.canvas.height;
      if (w === 'Rain') spawn(6, () => ({ type: 'rain', x: Math.random() * W, y: -10, vx: -60, vy: 700, life: 1 }));
      else if (w === 'Blizzard') spawn(8, () => ({ type: 'snow', x: Math.random() * W, y: -10, vx: -120 + Math.random() * 40, vy: 200 + Math.random() * 120, life: 3, s: 1 + Math.random() * 2 }));
      else if (w === 'Ashfall') { spawn(3, () => ({ type: 'ash', x: Math.random() * W, y: -10, vx: -10, vy: 60 + Math.random() * 40, life: 4, s: 1 + Math.random() * 2 })); spawn(1, () => ({ type: 'ember', x: Math.random() * W, y: H + 5, vx: 0, vy: -40 - Math.random() * 30, life: 3 })); }
      else if (w === 'Fog') { if (this.weatherParts.length < 40) spawn(1, () => ({ type: 'fog', x: Math.random() * W, y: Math.random() * H, vx: 12, vy: 0, life: 6, s: 40 + Math.random() * 40 })); }
      else if (w === 'Storm') { spawn(5, () => ({ type: 'rain', x: Math.random() * W, y: -10, vx: -140, vy: 800, life: 1 })); if (Math.random() < 0.01) this.lightning = 0.12; }

    }
    _weatherDraw(ctx, m) {

        if (p.type === 'rain') { ctx.strokeStyle = 'rgba(150,180,220,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 3, p.y - 12); ctx.stroke(); }
        else if (p.type === 'snow') { ctx.fillStyle = 'rgba(240,250,255,0.8)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill(); }
        else if (p.type === 'ash') { ctx.fillStyle = 'rgba(120,110,100,0.6)'; ctx.fillRect(p.x, p.y, p.s, p.s); }
        else if (p.type === 'ember') { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = A.alpha('#ff8a3a', Math.min(1, p.life)); ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
        else if (p.type === 'fog') { ctx.fillStyle = A.alpha('#c8c8c8', 0.05 * Math.min(1, p.life)); ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
    }

    /* --------------------------- night / grade ---------------------- */
    _night(ctx, m, W, H) {
      if (m.isNight) {
        const k = m.dayT > 0.5 ? (m.dayT - 0.5) * 2 : 0; const dark = 0.15 + Math.sin(k * Math.PI) * 0.25;
        ctx.fillStyle = A.alpha('#101838', dark); ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (const t of m.towers) { const lt = t.def.traits.light; if (!lt) continue; const R = lt * TILE; const g = ctx.createRadialGradient(t.x, t.y, 3, t.x, t.y, R); g.addColorStop(0, 'rgba(255,220,150,0.35)'); g.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, TAU); ctx.fill(); }
        const gg = ctx.createRadialGradient(m.goalPx.x, m.goalPx.y, 3, m.goalPx.x, m.goalPx.y, 60); gg.addColorStop(0, 'rgba(217,164,65,0.3)'); gg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(m.goalPx.x, m.goalPx.y, 60, 0, TAU); ctx.fill();
        ctx.restore();
      }
      // weather grade
      const grade = { Rain: 'rgba(60,90,140,0.10)', Fog: 'rgba(200,200,200,0.12)', Blizzard: 'rgba(180,220,240,0.14)', Ashfall: 'rgba(120,60,30,0.12)', Storm: 'rgba(30,30,60,0.14)' }[m.weather];
      if (grade) { ctx.fillStyle = grade; ctx.fillRect(0, 0, W, H); }
      if (this.lightning > 0) { ctx.fillStyle = A.alpha('#eaf0ff', this.lightning * 3); ctx.fillRect(0, 0, W, H); }
    }
    _post(ctx, W, H, m) {
      // vignette
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (m.freeze > 0) { ctx.fillStyle = A.alpha('#ffffff', m.freeze * 0.15); ctx.fillRect(0, 0, W, H); }
    }

    _floaters(ctx, m) {
      ctx.textAlign = 'center';
      for (const f of m.floaters) {
        if (f.kind === 'puddle') { ctx.fillStyle = A.alpha('#7d5fa0', 0.2 + Math.sin(this.clock * 5) * 0.1); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); continue; }
        if (f.kind !== 'text') continue;
        ctx.globalAlpha = Math.max(0, f.t / 0.9);
        const big = f.big; ctx.font = (big ? 'bold 18px' : 'bold 12px') + ' sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(f.text, f.x + 1, f.y + 1);

/* ===== js/ui.js ===== */
/* =========================================================================
 * REALM SIEGE — js/ui.js
 * All screens (menu, map select, loadout, roll, forge, collection, codex,
 * settings, summary) + the in-match HUD and input. DOM overlay over a single
 * canvas. The Match/Renderer own the sim; this file is presentation + intent.
 * ========================================================================= */
(function () {
  'use strict';
  const RS = (window.RS = window.RS || {});
  const { fmt } = RS.util;
  const Meta = RS.Meta;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const star = (n) => '★★★☆☆☆'.slice(0, 0) + '★'.repeat(n) + '☆'.repeat(3 - n);

  const UI = {
    screen: 'menu',
    match: null,
    renderer: null,
    selectedMap: null,
    selectedDiff: null,
    workingLoadout: [],
    placing: null,     // tower def selected for placement
    selectedTower: null,

    init() {
      this.root = $('#app');
      // #game is created later in _buildHud; start the renderer on an offscreen
      // canvas so glyph drawing on menus works before any match exists.
      this.canvas = $('#game') || document.createElement('canvas');
      this.renderer = new RS.Renderer(this.canvas);
      this._bindGlobalKeys();
      this._bindCanvas();
      this._bindBus();
      this.show('menu');
    },

    toast(msg, color) {
      const t = h(`<div class="toast" style="border-color:${color || RS.PALETTE.gold}">${msg}</div>`);
      $('#toasts').appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
    },

    /* ------------------------------ routing --------------------------- */
    show(screen, arg) {
      this.screen = screen;
      this.placing = null; this.selectedTower = null;
      const inMatch = screen === 'match';
      $('#matchWrap').style.display = inMatch ? 'flex' : 'none';
      this.root.style.display = inMatch ? 'none' : 'block';
      if (inMatch) { this._buildHud(); return; }
      const map = {
        menu: () => this.renderMenu(), mapselect: () => this.renderMapSelect(),
        loadout: () => this.renderLoadout(arg), roll: () => this.renderRoll(),
        forge: () => this.renderForge(), collection: () => this.renderCollection(),
        codex: () => this.renderCodex(), settings: () => this.renderSettings(),
        summary: () => this.renderSummary(arg),
      };
      (map[screen] || map.menu)();
    },

    _topbar() {
      const t = Meta.p.tokens, a = Meta.p.account;
      const need = RS.ACCOUNT.xpCurve(a.level);
      return `<div class="topbar">
        <div class="brand">⚔ REALM SIEGE</div>
        <div class="tokens">
          <span class="tk copper" title="Copper">🟤 ${fmt(t.copper)}</span>
          <span class="tk silver" title="Silver">⚪ ${fmt(t.silver)}</span>
          <span class="tk gold" title="Gold">🟡 ${fmt(t.gold)}</span>
          <span class="tk relic" title="Mythic Relics">🔮 ${fmt(t.relic)}</span>
          <span class="tk lvl" title="Account level">Lv ${a.level} <span class="xpbar"><i style="width:${Math.min(100, a.xp / need * 100)}%"></i></span></span>
        </div>
      </div>`;
    },

    /* ------------------------------- menu ----------------------------- */
    renderMenu() {
      this.root.innerHTML = this._topbar() + `
        <div class="menu">
          <div class="menu-hero">
            <h1>REALM SIEGE</h1>
            <p class="sub">A Medieval Tower Defense · Roll the realm's champions</p>
          </div>
          <div class="menu-grid">
            <button class="mbtn play" data-go="mapselect"><b>⚔ Play</b><span>12 maps · 4 difficulties</span></button>
            <button class="mbtn" data-go="roll"><b>🎲 Roll</b><span>Summon towers</span></button>
            <button class="mbtn" data-go="collection"><b>🏰 Collection</b><span>${Meta.ownedTowerDefs().length}/26 towers</span></button>
            <button class="mbtn" data-go="forge"><b>🔨 Forge</b><span>${Meta.forgeUnlocked ? 'Convert & craft' : 'Unlocks Lv 2'}</span></button>
            <button class="mbtn" data-go="codex"><b>📖 Codex</b><span>${Math.round(Meta.codexPct() * 100)}% complete</span></button>
            <button class="mbtn" data-go="settings"><b>⚙ Settings</b><span>Save & options</span></button>
          </div>
          <div class="objectives">
            <h3>Objectives</h3>
            ${RS.OBJECTIVES.map((o) => { const pr = Meta.p.objectives[o.id] || 0; const done = pr >= o.goal; return `<div class="obj ${done ? 'done' : ''}"><span>${o.desc}</span><b>${Math.min(pr, o.goal)}/${o.goal}</b><em>${done ? '✓' : this._rewardStr(o.reward)}</em></div>`; }).join('')}
          </div>
        </div>`;
      this._wireGo();
    },
    _rewardStr(r) { return Object.entries(r).map(([k, v]) => `+${v} ${k}`).join(', '); },
    _wireGo() { $$('[data-go]', this.root).forEach((b) => b.onclick = () => this.show(b.dataset.go)); },

    /* ---------------------------- map select -------------------------- */
    renderMapSelect() {
      const hardcoreDone = Meta.allHardcoreCleared();
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>Choose Your Battlefield</h2></div>
          <div class="mapgrid">
          ${RS.MAPS.map((m, i) => {
            const comp = Meta.p.completions[m.id] || {};
            return `<div class="mapcard" data-map="${m.id}">
              <div class="mapnum">${i + 1}</div>
              <h3>${m.name}</h3>
              <p>${m.desc}</p>
              ${m.signature && RS.ENEMY_BY_ID[m.signature] ? `<div class="sigfoe">☠ Signature foe: <b>${RS.ENEMY_BY_ID[m.signature].name}</b></div>` : ''}
              <div class="difrow">
                ${RS.DIFFICULTY.map((d) => {
                  const unlocked = Meta.diffUnlocked(m.id, d.id);
                  const s = comp[d.id] ? comp[d.id].stars : 0;
                  return `<button class="difbtn ${unlocked ? '' : 'locked'} d-${d.id.toLowerCase()}" data-map="${m.id}" data-diff="${d.id}" ${unlocked ? '' : 'disabled'}>
                    <b>${d.id}</b><span>${unlocked ? (s ? star(s) : 'Play') : '🔒'}</span></button>`;
                }).join('')}
              </div>
            </div>`;
          }).join('')}
          ${hardcoreDone ? `<div class="mapcard endless" data-map="emberthrone" data-endless="1"><div class="mapnum">✦</div><h3>The Grey Herald</h3><p>Endless superboss. It copies your strongest tower every 60s.</p><button class="difbtn d-hardcore" data-endless="1" data-map="emberthrone">Enter the Endless</button></div>` : ''}
          </div>
        </div>`;
      this._wireGo();
      $$('.difbtn:not(.locked)', this.root).forEach((b) => b.onclick = () => {
        if (b.disabled) return;
        this.selectedMap = RS.MAP_BY_ID[b.dataset.map];
        this.selectedDiff = RS.DIFF_BY_ID[b.dataset.diff] || RS.DIFF_BY_ID.Hardcore;
        this.endless = b.dataset.endless === '1';
        this.show('loadout');
      });
    },

    /* --------------------------- loadout ------------------------------ */
    renderLoadout() {
      const slots = Meta.loadoutSlots;
      if (this.workingLoadout.length === 0) {
        const owned = Meta.ownedTowerDefs().sort((a, b) => RS.rarityRank(b.rarity) - RS.rarityRank(a.rarity));
        this.workingLoadout = owned.slice(0, slots).map((t) => t.id);
      }
      this.workingLoadout = this.workingLoadout.slice(0, slots);
      const owned = Meta.ownedTowerDefs();
      const warn = this._coverageWarnings(this.workingLoadout);
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="mapselect">← Maps</button>
            <h2>Loadout · ${this.selectedMap.name} <span class="pill d-${this.selectedDiff.id.toLowerCase()}">${this.selectedDiff.id}</span></h2></div>
          <div class="loadout-slots">
            ${Array.from({ length: slots }).map((_, i) => { const id = this.workingLoadout[i]; const t = id && RS.TOWER_BY_ID[id]; return `<div class="slot ${t ? '' : 'empty'}" data-slot="${i}">${t ? this._towerChip(t, true) : '<span>empty</span>'}</div>`; }).join('')}
          </div>
          ${warn.length ? `<div class="warnbar">⚠ ${warn.join(' · ')}</div>` : '<div class="okbar">✓ Balanced loadout</div>'}
          <h3>Your Collection <small>(click to add/remove — need ${slots} slots)</small></h3>
          <div class="collgrid small">
            ${owned.map((t) => `<div class="cchip ${this.workingLoadout.includes(t.id) ? 'in' : ''}" data-add="${t.id}">${this._towerChip(t)}</div>`).join('')}
          </div>
          <div class="loadout-actions">
            <button class="bigbtn ${this.workingLoadout.length ? '' : 'disabled'}" id="startMatch">Deploy → Start ${this.selectedDiff.id}</button>
          </div>
        </div>`;
      this._wireGo();
      $$('[data-add]', this.root).forEach((c) => c.onclick = () => {
        const id = c.dataset.add;
        const idx = this.workingLoadout.indexOf(id);
        if (idx >= 0) this.workingLoadout.splice(idx, 1);
        else if (this.workingLoadout.length < slots) this.workingLoadout.push(id);
        else this.toast('Loadout full', RS.PALETTE.warn);
        this.renderLoadout();
      });
      $$('.slot', this.root).forEach((s) => s.onclick = () => { const i = +s.dataset.slot; if (this.workingLoadout[i]) { this.workingLoadout.splice(i, 1); this.renderLoadout(); } });
      $('#startMatch').onclick = () => this.startMatch();
    },

    _coverageWarnings(ids) {
      const defs = ids.map((id) => RS.TOWER_BY_ID[id]);
      const w = [];
      const hasAir = defs.some((t) => t.traits.bonusVs && (t.traits.bonusVs.trait === 'Flying') || t.traits.summon || t.traits.flying || t.def === undefined && false || ['longbow', 'falconer', 'archmage', 'wyvernrider', 'ballista', 'archer', 'crossbow', 'longbowman'].includes(t.id) || t.rangeT >= 3.4);
      const antiArmor = defs.some((t) => (t.traits.bonusVs && t.traits.bonusVs.trait === 'Armored') || t.traits.armorPen || t.damageType === 'True' || t.damageType === 'Magic' || t.traits.breakShield);
      const antiMagic = defs.some((t) => ['Physical', 'Piercing', 'True', 'Holy'].includes(t.damageType));
      if (!hasAir) w.push('No reliable anti-air');
      if (!antiArmor) w.push('Weak vs Armored');
      if (defs.length < Meta.loadoutSlots) w.push(`${Meta.loadoutSlots - defs.length} empty slot(s)`);
      return w;
    },

    _towerChip(t, big) {
      const c = RS.rarityColor(t.rarity);
      const owned = Meta.ownedCount(t.id);
      return `<div class="tchip" style="--rc:${c}">
        <div class="tchip-icon"><canvas class="glyph" data-glyph="${t.id}" width="40" height="40"></canvas></div>
        <div class="tchip-info"><b>${t.name}</b><span>${t.rarity} · ${t.cost}g</span>
        ${big ? `<em>DPS ${fmt(RS.towerDps(t))} · ${t.damageType}</em>` : ''}</div>
        ${owned > 1 ? `<span class="dup">×${owned}</span>` : ''}
      </div>`;
    },

    _drawGlyphs(root) {
      $$('canvas.glyph', root || document).forEach((cv) => {
        const id = cv.dataset.glyph; const t = RS.TOWER_BY_ID[id]; if (!t) return;
        const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
        RS.Sprites.drawTowerIcon(ctx, t, cv.width / 2, cv.height / 2 + 3, Math.min(cv.width, cv.height) * 0.86);
      });
    },

    /* ------------------------------ roll ------------------------------ */
    renderRoll() {
      const pity = Meta.p.pity;
      const bar = (label, cur, max, color) => `<div class="pitybar"><span>${label}</span><div class="pb"><i style="width:${Math.min(100, cur / max * 100)}%;background:${color}"></i></div><em>${cur}/${max}</em></div>`;
      this.root.innerHTML = this._topbar() + `
        <div class="page rollpage">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>The Rolling Banner</h2></div>
          <div class="rollstage" id="rollStage"><div class="banner-idle">Roll to summon a champion</div></div>
          <div class="rollbtns">
            ${Object.values(RS.ROLLS).map((r) => `<button class="rollbtn ${Meta.canRoll(r.id) ? '' : 'disabled'}" data-roll="${r.id}">
              <b>${r.id} Roll</b><span>${r.label}</span><em>floor: ${r.floor}</em>
              ${Meta.p.rolls[r.id] > 0 ? `<span class="tickets">🎟 ${Meta.p.rolls[r.id]}</span>` : ''}</button>`).join('')}
          </div>
          <div class="multirow"><button class="multibtn" data-multi="Basic">Basic ×10</button><button class="multibtn" data-multi="Lucky">Lucky ×10</button><button class="multibtn" data-multi="Super">Super ×10</button></div>
          <div class="pity">
            <h3>Pity Counters</h3>
            ${bar('Epic guarantee', pity.epic, RS.PITY.epic.hard, '#9b59b6')}
            ${bar('Legendary', pity.legend, RS.PITY.legend.hard, '#f0a92e')}
            ${bar('Mythic', pity.mythic, RS.PITY.mythic.hard, '#e04b4b')}
            ${bar('Mythic+ (cumulative)', pity.plus, RS.PITY.plus.hard, '#fff')}
          </div>
          <div class="history"><h3>Recent Rolls</h3><div class="histlist">${this._rollHistoryHtml()}</div></div>
        </div>`;
      this._wireGo();
      $$('[data-roll]', this.root).forEach((b) => b.onclick = () => this.doRoll(b.dataset.roll, 1));
      $$('[data-multi]', this.root).forEach((b) => b.onclick = () => this.doRoll(b.dataset.multi, 10));
    },
    _rollHistoryHtml() {
      return Meta.p.rollHistory.slice(0, 18).map((e) => {
        if (e.converted) return `<span class="hchip" style="--rc:${RS.rarityColor('Mythic')}">Legendary→ ${e.converted.relic}🔮</span>`;
        const t = RS.TOWER_BY_ID[e.towerId];
        return `<span class="hchip" style="--rc:${RS.rarityColor(e.rarity)}">${t ? t.name : e.rarity}</span>`;
      }).join('') || '<em>No rolls yet.</em>';
    },

    doRoll(tier, times) {
      if (!Meta.canRoll(tier)) { this.toast('Not enough resources', RS.PALETTE.bad); return; }

      for (let i = 0; i < times; i++) {

        const r = Meta.roll(tier);

        best = Math.max(best, RS.rarityRank(r.rarity));
      }
      this._playRollAnim(results, best);
    },

    _playRollAnim(results, bestRank) {
      const stage = $('#rollStage');
      const bestColor = RS.RARITY[bestRank].color;
      stage.innerHTML = `<div class="banner-spin" style="--flare:${bestColor}"></div>`;
      const spin = stage.firstElementChild;
      const dur = 700 + bestRank * 300;
      // escalating flare
      spin.animate([{ filter: 'brightness(1)' }, { filter: `brightness(${1.5 + bestRank * 0.4})` }, { filter: 'brightness(1)' }], { duration: dur, iterations: 1 });
      if (bestRank >= 6) { document.body.classList.add('shatter'); setTimeout(() => document.body.classList.remove('shatter'), 900); }
      if (bestRank >= 5) this.match && (this.match.freeze = 0.4);
      setTimeout(() => {
        stage.innerHTML = `<div class="results">${results.map((r) => {
          if (r.converted) return `<div class="rescard" style="--rc:${RS.rarityColor('Mythic')}"><div class="resrar">50/50 → Relics</div><b>+${r.converted.relic} 🔮</b></div>`;
          const t = r.tower; const dup = Meta.ownedCount(t.id) > 1;
          return `<div class="rescard ${RS.rarityRank(r.rarity) >= 5 ? 'shine' : ''}" style="--rc:${RS.rarityColor(r.rarity)}">

            <canvas class="glyph rg" data-glyph="${t.id}" width="48" height="48"></canvas>
            <b>${t.name}</b>${dup ? '<span class="dupflag">DUPLICATE</span>' : '<span class="newflag">NEW</span>'}
          </div>`;
        }).join('')}</div>`;
        this._drawGlyphs(stage);
        // full-screen rarity reveal spectacle (glow bloom / column / shatter)
        const rect = stage.getBoundingClientRect();
        RS.VFX.overlay.reveal(RS.RARITY[bestRank].id, rect.left + rect.width / 2, rect.top + rect.height / 2);

        this._refreshTopbar();
        this._refreshPity();
      }, dur);
    },
    _refreshTopbar() { const tb = $('.topbar', this.root); if (tb) tb.outerHTML = this._topbar(); },
    _refreshPity() { /* re-render pity + history areas if present */ const p = $('.pity', this.root); if (p) { this.renderRollPartial(); } },
    renderRollPartial() {
      const pity = Meta.p.pity;
      const bar = (label, cur, max, color) => `<div class="pitybar"><span>${label}</span><div class="pb"><i style="width:${Math.min(100, cur / max * 100)}%;background:${color}"></i></div><em>${cur}/${max}</em></div>`;
      const pd = $('.pity', this.root); if (pd) pd.innerHTML = `<h3>Pity Counters</h3>${bar('Epic guarantee', pity.epic, RS.PITY.epic.hard, '#9b59b6')}${bar('Legendary', pity.legend, RS.PITY.legend.hard, '#f0a92e')}${bar('Mythic', pity.mythic, RS.PITY.mythic.hard, '#e04b4b')}${bar('Mythic+ (cumulative)', pity.plus, RS.PITY.plus.hard, '#fff')}`;

    },

    /* ------------------------------ forge ----------------------------- */
    renderForge() {
      if (!Meta.forgeUnlocked) { this.root.innerHTML = this._topbar() + `<div class="page"><div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>Forge</h2></div><p class="locked-note">The Forge unlocks at Account Level 2. Clear a few waves!</p></div>`; this._wireGo(); return; }
      const t = Meta.p.tokens, rolls = Meta.p.rolls, sh = Meta.p.shards;
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>The Forge <small>lossy conversion · the escape from RNG</small></h2></div>
          <div class="forge-cols">
            <div class="forge-col"><h3>Token Conversion</h3>
              ${RS.FORGE.tokenConvert.map((r) => `<div class="conv"><span>${r.n} ${r.from} → 1 ${r.to}</span><button data-ctok="${r.from}" class="${t[r.from] >= r.n ? '' : 'disabled'}">Convert</button></div>`).join('')}
            </div>

            </div>
          </div>

          <div class="shardrow">${RS.RARITY.map((r) => `<div class="shard" style="--rc:${r.color}"><b>${r.id}</b><span>${sh[r.id]}</span><button data-upcast="${r.id}" class="${sh[r.id] >= RS.FORGE.upcast ? '' : 'disabled'}">↑5→1</button></div>`).join('')}</div>

          <div class="craftgrid">
            ${RS.TOWERS.map((tw) => { const owned = Meta.ownedCount(tw.id); const craftCost = RS.FORGE.shards[tw.rarity].craft; const canCraft = sh[tw.rarity] >= craftCost; return `<div class="craftcard" style="--rc:${RS.rarityColor(tw.rarity)}">
              <canvas class="glyph" data-glyph="${tw.id}" width="36" height="36"></canvas>
              <div><b>${tw.name}</b><span>${tw.rarity} · owned ${owned}</span></div>

                <button data-dismantle="${tw.id}" class="${owned > 1 ? '' : 'disabled'}" title="Dismantle a duplicate for ${RS.FORGE.shards[tw.rarity].dismantle} shards">Dismantle</button>
              </div></div>`; }).join('')}
          </div>
        </div>`;
      this._wireGo(); this._drawGlyphs(this.root);
      const refresh = () => { this.renderForge(); };
      const strike = (el, color) => { const r = el.getBoundingClientRect(); RS.VFX.overlay.forgeStrike(r.left + r.width / 2, r.top + r.height / 2, color); };
      $$('[data-ctok]', this.root).forEach((b) => b.onclick = () => { if (Meta.convertTokens(b.dataset.ctok)) { strike(b, '#ffd98a'); refresh(); } });
      $$('[data-croll]', this.root).forEach((b) => b.onclick = () => { if (Meta.convertRolls(b.dataset.croll)) { strike(b, '#ffd98a'); refresh(); } });
      $$('[data-upcast]', this.root).forEach((b) => b.onclick = () => { if (Meta.upcastShards(b.dataset.upcast)) { strike(b, '#c79bff'); refresh(); } });
      $$('[data-craft]', this.root).forEach((b) => b.onclick = () => { const def = RS.TOWER_BY_ID[b.dataset.craft]; if (Meta.craftTower(b.dataset.craft)) { strike(b, RS.rarityColor(def.rarity)); this.toast('Crafted ' + def.name, RS.PALETTE.good); setTimeout(refresh, 120); } });
      $$('[data-dismantle]', this.root).forEach((b) => b.onclick = () => { if (Meta.dismantle(b.dataset.dismantle)) { const r = b.getBoundingClientRect(); RS.VFX.overlay.stream(r.left + r.width / 2, r.top, r.left, 120, RS.rarityColor(RS.TOWER_BY_ID[b.dataset.dismantle].rarity)); refresh(); } });
    },

    /* --------------------------- collection --------------------------- */
    renderCollection() {
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>Collection <small>${Meta.ownedTowerDefs().length}/26</small></h2></div>
          <div class="collgrid">
          ${RS.TOWERS.map((t) => {
            const owned = Meta.ownedCount(t.id);
            return `<div class="collcard ${owned ? '' : 'locked'}" style="--rc:${RS.rarityColor(t.rarity)}" data-info="${t.id}">
              ${owned ? `<canvas class="glyph" data-glyph="${t.id}" width="48" height="48"></canvas>` : '<div class="silhouette">?</div>'}
              <b>${owned ? t.name : '???'}</b>
              <span class="rar">${t.rarity}</span>
              ${owned ? `<em>DPS ${fmt(RS.towerDps(t))}</em>` : '<em>Locked</em>'}
              ${owned > 1 ? `<span class="dup">×${owned}</span>` : ''}
            </div>`;
          }).join('')}
          </div>
        </div>`;
      this._wireGo(); this._drawGlyphs(this.root);
      $$('[data-info]', this.root).forEach((c) => c.onclick = () => { if (Meta.ownedCount(c.dataset.info)) this.showTowerModal(c.dataset.info); });
    },

    showTowerModal(id) {
      const t = RS.TOWER_BY_ID[id];
      const modal = h(`<div class="modal-bg"><div class="modal" style="--rc:${RS.rarityColor(t.rarity)}">
        <button class="modal-x">✕</button>
        <div class="modal-head"><canvas class="glyph" data-glyph="${t.id}" width="56" height="56"></canvas><div><h3>${t.name}</h3><span>${t.rarity} · ${t.placement} · ${t.damageType}</span></div></div>
        <div class="statgrid">
          <div><b>${fmt(RS.towerDps(t))}</b><span>DPS</span></div>
          <div><b>${t.damage}</b><span>Damage</span></div>
          <div><b>${t.fireRate.toFixed(2)}/s</b><span>Fire rate</span></div>
          <div><b>${t.rangeT.toFixed(1)}t</b><span>Range</span></div>
          <div><b>${t.cost}g</b><span>Cost</span></div>
          <div><b>${t.splashT || '—'}</b><span>Splash</span></div>
        </div>
        <div class="branches"><h4>Level 4 Specialisations</h4>
          ${t.upgrades.branch.map((b) => `<div class="branch"><b>${b.name}</b><span>${b.desc}</span></div>`).join('')}
          <h4>Ascension (Lv 5)</h4><p>${t.ascend.desc}</p></div>
        <p class="lore">"${t.lore}"</p>
      </div></div>`);
      document.body.appendChild(modal);
      this._drawGlyphs(modal);
      modal.onclick = (e) => { if (e.target === modal || e.target.classList.contains('modal-x')) modal.remove(); };
    },

    /* ------------------------------ codex ----------------------------- */
    renderCodex() {
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>Codex <small>${Math.round(Meta.codexPct() * 100)}% · 100% awards Relics</small></h2></div>
          <h3>Enemies</h3>
          <div class="codexgrid">
          ${RS.ENEMIES.filter((e) => !e.hidden && !e.traits.includes('Boss')).map((e) => { const seen = Meta.p.codex.enemies.includes(e.id); return `<div class="codexcard ${seen ? '' : 'locked'}"><b>${seen ? e.name : '???'}</b><span>${e.family}</span>${seen ? `<em>HP ${e.hp} · SPD ${e.speed} · AR ${e.armor}</em><div class="traits">${e.traits.map((t) => `<i>${t}</i>`).join('')}</div>` : '<em>Not yet encountered</em>'}</div>`; }).join('')}
          </div>
          <h3>Bosses</h3>
          <div class="codexgrid">
          ${RS.ENEMIES.filter((e) => e.traits.includes('Boss')).map((e) => { const seen = Meta.p.codex.enemies.includes(e.id); return `<div class="codexcard boss ${seen ? '' : 'locked'}"><b>${seen ? e.name : '??? Boss'}</b><span>${e.family}</span>${seen ? `<em>HP ${fmt(e.hp)}</em>` : '<em>Undiscovered</em>'}</div>`; }).join('')}
          </div>
        </div>`;
      this._wireGo();
    },

    /* ---------------------------- settings ---------------------------- */
    renderSettings() {
      const s = Meta.p.settings;
      this.root.innerHTML = this._topbar() + `
        <div class="page">
          <div class="page-head"><button class="back" data-go="menu">← Menu</button><h2>Settings & Save</h2></div>
          <div class="settings">
            <label class="toggle"><input type="checkbox" id="setRange" ${s.showRange ? 'checked' : ''}> Show range overlays by default</label>
            <label class="toggle"><input type="checkbox" id="setPart" ${s.particles ? 'checked' : ''}> Particles</label>
            <label class="toggle"><input type="checkbox" id="setSfx" ${s.sfx ? 'checked' : ''}> Sound cues</label>
          </div>
          <h3>Save Management</h3>
          <div class="savebox">
            <button class="bigbtn" id="expBtn">Export Save</button>
            <button class="bigbtn" id="impBtn">Import Save</button>
            <button class="bigbtn danger" id="resetBtn">Reset Everything</button>
          </div>
          <textarea id="saveText" placeholder="Exported save appears here / paste a save to import" spellcheck="false"></textarea>
        </div>`;
      this._wireGo();
      $('#setRange').onchange = (e) => { s.showRange = e.target.checked; Meta.save(); };
      $('#setPart').onchange = (e) => { s.particles = e.target.checked; Meta.save(); };
      $('#setSfx').onchange = (e) => { s.sfx = e.target.checked; Meta.save(); };
      $('#expBtn').onclick = () => { $('#saveText').value = Meta.exportSave(); this.toast('Save exported below', RS.PALETTE.good); };
      $('#impBtn').onclick = () => { if (Meta.importSave($('#saveText').value)) { this.toast('Save imported!', RS.PALETTE.good); this.renderSettings(); } else this.toast('Invalid save string', RS.PALETTE.bad); };
      $('#resetBtn').onclick = () => { if (confirm('Wipe all progress?')) { Meta.reset(); this.toast('Progress reset', RS.PALETTE.warn); this.show('menu'); } };
    },

    /* ============================ MATCH HUD =========================== */
    startMatch() {
      const meta = { roster: Meta.p.roster, bonusStartGold: Meta.bonusStartGold, freeAscend: false };
      const diff = this.endless ? Object.assign({}, this.selectedDiff, { waves: 999, boss: 'boss_herald', endless: true }) : this.selectedDiff;
      this.match = new RS.Match(this.selectedMap, diff, this.workingLoadout, meta);
      this.renderer.showRange = Meta.p.settings.showRange;
      this.renderer.selected = null; this.renderer.ghost = null;
      this.show('match');
    },

    _buildHud() {
      $('#matchWrap').innerHTML = `
        <canvas id="game" width="${RS.WORLD.w}" height="${RS.WORLD.h}"></canvas>
        <div id="hud">
          <div class="hud-top">
            <div class="hstat lives">❤ <b id="hLives">0</b></div>
            <div class="hstat gold">🟡 <b id="hGold">0</b></div>
            <div class="hstat wave">Wave <b id="hWave">0</b>/<span id="hMax">0</span></div>
            <div class="hstat weather" id="hWeather"></div>
            <div class="hud-speed">
              <button id="btnPause" title="Space">⏸</button>
              <button id="btnSpeed" title="F">1×</button>
              <button id="btnMenu">☰</button>
            </div>
          </div>
          <div class="hud-preview" id="hPreview"></div>
          <div class="hud-tray" id="hTray"></div>
          <div class="hud-selected" id="hSelected"></div>
          <button class="callwave" id="btnWave">▶ Start Wave <small>R</small></button>
        </div>`;
      this.canvas = $('#game'); this.renderer.canvas = this.canvas; this.renderer.ctx = this.canvas.getContext('2d');
      this._bindCanvas();
      this._buildTray();
      $('#btnWave').onclick = () => this.onWaveButton();
      $('#btnPause').onclick = () => this.togglePause();
      $('#btnSpeed').onclick = () => this.cycleSpeed();
      $('#btnMenu').onclick = () => { if (confirm('Abandon this battle?')) { this.match = null; this.show('mapselect'); } };
      $('#hMax').textContent = this.match.maxWaves > 900 ? '∞' : this.match.maxWaves;
      this.refreshHud();
    },

    _buildTray() {
      const m = this.match;
      const tray = $('#hTray');
      tray.innerHTML = this.workingLoadout.map((id, i) => {
        const t = RS.TOWER_BY_ID[id];
        return `<button class="trayitem" data-place="${id}" data-key="${i + 1}" style="--rc:${RS.rarityColor(t.rarity)}">
          <span class="hot">${i + 1}</span>
          <canvas class="glyph" data-glyph="${id}" width="36" height="36"></canvas>
          <b>${t.cost}g</b></button>`;
      }).join('');
      this._drawGlyphs(tray);
      $$('[data-place]', tray).forEach((b) => b.onclick = () => this.selectPlacement(b.dataset.place));
    },

    selectPlacement(id) {
      const t = RS.TOWER_BY_ID[id];
      if (Meta.ownedCount(id) <= 0) { this.toast('You do not own this tower', RS.PALETTE.bad); return; }
      this.placing = t; this.renderer.ghost = t; this.selectedTower = null; this.renderer.selected = null;
      $$('.trayitem', document).forEach((b) => b.classList.toggle('active', b.dataset.place === id));
      this.refreshSelected();
    },

    onWaveButton() {
      const m = this.match; if (!m) return;
      if (m.waveActive) m.callEarly();
      else m.startWave();
      this.refreshHud();
    },
    togglePause() { if (!this.match) return; this.match.paused = !this.match.paused; $('#btnPause').textContent = this.match.paused ? '▶' : '⏸'; },
    cycleSpeed() { const m = this.match; if (!m) return; m.speed = m.speed === 1 ? 2 : m.speed === 2 ? 4 : 1; $('#btnSpeed').textContent = m.speed + '×'; },

    /* ------------------------ match render tick ----------------------- */
    matchTick(dt) {
      const m = this.match; if (!m) return;
      const eff = m.freeze > 0 ? dt * 0.15 : dt;
      m.frame(eff);
      m.updateParticles(eff * m.speed);
      this.renderer.showRange = Meta.p.settings.showRange || this._tabRange;
      this.renderer.updateVisuals(m, eff * m.speed); // presentational animation/VFX only
      this.renderer.draw(m);
      this.refreshHud(true);
      if (m.state === 'won' || m.state === 'lost') this.endMatch();
    },

    refreshHud(light) {
      const m = this.match; if (!m) return;
      $('#hLives').textContent = m.lives;
      $('#hGold').textContent = fmt(Math.floor(m.gold));
      $('#hWave').textContent = m.waveIndex;
      const w = RS.WEATHER[m.weather];
      $('#hWeather').innerHTML = `${m.isNight ? '🌙 ' : '☀ '}${m.weather}${m.nextWeather ? ` → <em>${m.nextWeather}</em>` : ''}`;
      const wb = $('#btnWave');
      if (m.state === 'won' || m.state === 'lost') { wb.style.display = 'none'; }
      else if (m.waveActive) { wb.innerHTML = `⏩ Call Early <small>+${Math.round(m.waveTimeLeft * RS.WAVE.callEarlyBonusPerSec)}g</small>`; }
      else { wb.innerHTML = `▶ Start Wave ${m.waveIndex + 1} <small>R</small>`; }
      if (!light) this._refreshPreview();
      else if ((this._pvWave !== m.waveIndex) ) { this._refreshPreview(); this._pvWave = m.waveIndex; }
      // trays enable/disable by affordability
      $$('.trayitem', document).forEach((b) => { const t = RS.TOWER_BY_ID[b.dataset.place]; b.classList.toggle('poor', m.gold < t.cost); });
      // keep selected tower panel live
      if (this.selectedTower && this.selectedTower._live !== undefined) this.refreshSelected();
      else if (this.selectedTower) this.refreshSelected();
    },

    _refreshPreview() {
      const m = this.match; const pv = m.pendingWavePreview; if (!pv) return;
      const comp = Object.entries(pv.comp).map(([n, c]) => `<span>${c}× ${n}</span>`).join('');
      $('#hPreview').innerHTML = `<div class="pv-head">Next: Wave ${pv.n} <em>${pv.arch}</em></div>
        <div class="pv-tags">${pv.tags.map((t) => `<i class="tag t-${t.toLowerCase()}">${t}</i>`).join('')}</div>
        <div class="pv-comp">${comp}</div>`;
    },

    refreshSelected() {
      const sel = this.selectedTower;
      const box = $('#hSelected'); if (!box) return;
      if (this.placing) {
        const t = this.placing;
        box.innerHTML = `<div class="sel-head"><b>Placing: ${t.name}</b><button class="cancel" id="cancelPlace">✕</button></div>
          <div class="sel-stats">${t.rarity} · ${t.cost}g · ${t.damageType} · range ${t.rangeT}t</div>
          <div class="sel-hint">Click a valid tile. Esc to cancel.</div>`;
        $('#cancelPlace').onclick = () => { this.placing = null; this.renderer.ghost = null; $$('.trayitem').forEach((b) => b.classList.remove('active')); this.refreshSelected(); };
        return;
      }
      if (!sel) { box.innerHTML = ''; return; }
      const m = this.match;
      const upCost = m.upgradeCost(sel);
      const canUp = sel.level < 5 && m.gold >= upCost;
      const needBranch = sel.level === 3;
      const needDup = sel.level === 4 && Meta.ownedCount(sel.def.id) < 2;
      box.innerHTML = `<div class="sel-head"><b>${sel.def.name}</b> <span class="lvl">L${sel.level}${sel.ascended ? ' ✦' : ''}</span><button class="cancel" id="deselBtn">✕</button></div>
        <div class="sel-stats">DPS ${fmt(sel.damage * sel.fireRate * sel.buff.dmg)} · rng ${Math.round(m._effectiveRange(sel))} · ${sel.def.damageType}</div>
        <div class="sel-targets">Target: ${['First', 'Last', 'Strongest', 'Weakest', 'Closest', 'Most-Clustered'].map((mo) => `<button class="tbtn ${sel.targeting === mo ? 'on' : ''}" data-target="${mo}">${mo}</button>`).join('')}</div>
        <div class="sel-actions">
          ${sel.level < 5 ? `<button id="upBtn" class="${canUp && !needDup ? '' : 'disabled'}">${needBranch ? 'Choose Path' : 'Upgrade'} (${upCost}g)</button>` : '<span class="maxed">MAX ✦</span>'}
          ${needDup ? '<span class="hint">Need duplicate to Ascend</span>' : ''}
          ${sel.def.traits.active ? `<button id="actBtn" class="${sel.activeReady ? 'active-ready' : 'disabled'}">${sel.def.traits.active.name}${sel.activeReady ? '' : ' (' + Math.ceil(sel.activeCd) + 's)'}</button>` : ''}
          ${m.diff.noSell ? '' : `<button id="sellBtn" class="sell">Sell (+${Math.round(sel.invested * 0.7)}g)</button>`}
        </div>
        ${needBranch ? `<div class="branchpick">${sel.def.upgrades.branch.map((b, i) => `<button data-branch="${i}"><b>${b.name}</b><span>${b.desc}</span></button>`).join('')}</div>` : ''}`;
      $('#deselBtn').onclick = () => { this.selectedTower = null; this.renderer.selected = null; this.refreshSelected(); };
      $$('[data-target]', box).forEach((b) => b.onclick = () => { sel.targeting = b.dataset.target; this.refreshSelected(); });
      const up = $('#upBtn'); if (up && !needBranch) up.onclick = () => { if (m.upgrade(sel)) this.refreshSelected(); };
      $$('[data-branch]', box).forEach((b) => b.onclick = () => { if (m.upgrade(sel, +b.dataset.branch)) this.refreshSelected(); });
      const act = $('#actBtn'); if (act) act.onclick = () => { m.activateTower(sel); };
      const sell = $('#sellBtn'); if (sell) sell.onclick = () => { m.sell(sel); this.selectedTower = null; this.renderer.selected = null; this.refreshSelected(); };
    },

    /* --------------------------- match input -------------------------- */
    _bindCanvas() {
      const cv = this.canvas; if (!cv) return;
      const toTile = (ev) => { const r = cv.getBoundingClientRect(); const sx = cv.width / r.width, sy = cv.height / r.height; const x = (ev.clientX - r.left) * sx, y = (ev.clientY - r.top) * sy; return { x, y, c: (x / RS.TILE) | 0, r: (y / RS.TILE) | 0 }; };
      cv.onmousemove = (ev) => { const t = toTile(ev); this.renderer.hover = { c: t.c, r: t.r }; this._mouse = t; };
      cv.onmouseleave = () => { this.renderer.hover = null; };
      cv.onclick = (ev) => {
        const m = this.match; if (!m) return; const t = toTile(ev);
        if (this.placing) {
          const res = m.place(this.placing, t.c, t.r);
          if (res.ok) { if (!(ev.shiftKey)) { this.placing = null; this.renderer.ghost = null; $$('.trayitem').forEach((b) => b.classList.remove('active')); } this.refreshSelected(); }
          else this.toast(res.reason, RS.PALETTE.bad);
          return;
        }
        // select a tower
        let hit = null, bd = 1e9;
        for (const tw of m.towers) { const d = (tw.x - t.x) ** 2 + (tw.y - t.y) ** 2; if (d < 22 * 22 && d < bd) { bd = d; hit = tw; } }
        this.selectedTower = hit; this.renderer.selected = hit; this.refreshSelected();
      };
    },

    _bindGlobalKeys() {
      window.addEventListener('keydown', (e) => {
        if (this.screen !== 'match' || !this.match) {
          if (this.screen === 'roll' && (e.key === 'r' || e.key === 'R')) this.doRoll('Basic', 1);
          return;
        }
        const m = this.match;
        if (e.key >= '1' && e.key <= '9') { const idx = +e.key - 1; if (this.workingLoadout[idx]) this.selectPlacement(this.workingLoadout[idx]); }
        else if (e.code === 'Space') { e.preventDefault(); this.togglePause(); }
        else if (e.key === 'f' || e.key === 'F') this.cycleSpeed();
        else if (e.key === 'r' || e.key === 'R') this.onWaveButton();
        else if (e.key === 'Escape') { if (this.placing) { this.placing = null; this.renderer.ghost = null; $$('.trayitem').forEach((b) => b.classList.remove('active')); } else { this.selectedTower = null; this.renderer.selected = null; } this.refreshSelected(); }
        else if (e.key === 'Tab') { e.preventDefault(); this._tabRange = !this._tabRange; }
      });
    },

    /* -------------------------- match resolve ------------------------- */
    endMatch() {
      const m = this.match; if (this._ended) return; this._ended = true;
      const won = m.state === 'won';
      // record codex from encountered
      m.encountered.forEach((k) => { if (k.startsWith('enemy:')) Meta.seeEnemy(k.slice(6)); });
      // rewards
      const rewards = { copper: 0, silver: 0, gold: 0, relic: 0, xp: 0 };
      rewards.copper = Math.round(m.copperEarned);
      rewards.xp = m.waveIndex * RS.ACCOUNT.xpPerWave;
      if (won) {
        rewards.xp += RS.ACCOUNT.xpPerMapClear;
        rewards.silver = Math.round(RS.ECON.silverPerMap * m.diff.tokenMult);
        if (m.diff.order >= 2) rewards.gold = Math.round(3 * m.diff.tokenMult);
        if (m.diff.order === 3) rewards.relic = 2;
        if (m.goldFromBoss) { rewards.gold += m.goldFromBoss * RS.ECON.goldPerBossKill; rewards.xp += RS.ACCOUNT.xpPerBoss; }
        // Hard clear grants a Super roll ticket
        if (m.diff.id === 'Hard') Meta.p.rolls.Super += 1;
        Meta.recordClear(m.map.id, m.diff.id, m.stars, true);
      }
      Meta.grant('copper', rewards.copper); Meta.grant('silver', rewards.silver);
      Meta.grant('gold', rewards.gold); Meta.grant('relic', rewards.relic);
      const leveled = Meta.addXp(rewards.xp);
      // objective: kills by family
      for (const fam in m.killsByFamily) Meta.updateObjective('killFamily', m.killsByFamily[fam], fam);
      Meta.updateObjective('kill', m.totalKills);
      Meta.p.stats.kills += m.totalKills;
      Meta.save();
      this._lastRewards = rewards; this._lastLeveled = leveled;
      setTimeout(() => { this._ended = false; this.show('summary'); }, 400);
    },

    renderSummary() {
      const m = this.match; const won = m.state === 'won'; const r = this._lastRewards;
      // damage by tower chart
      const rows = Object.entries(m.dmgByTower).map(([uid, dmg]) => { const tw = m.towers.find((t) => t.uid === +uid) || { def: { name: 'Sold/Lost tower' } }; return { name: tw.def.name, dmg }; }).sort((a, b) => b.dmg - a.dmg).slice(0, 8);
      const maxDmg = rows.length ? rows[0].dmg : 1;
      const total = Object.values(m.dmgByTower).reduce((a, b) => a + b, 0) || 1;
      this.root.innerHTML = this._topbar() + `
        <div class="page summary">
          <div class="summary-banner ${won ? 'win' : 'lose'}">${won ? '🏆 VICTORY' : '💀 DEFEAT'}</div>
          <h2>${m.map.name} · ${m.diff.id}</h2>
          ${won ? `<div class="stars-big">${star(m.stars)}</div><div class="starnote">1★ clear · 2★ no leaks · 3★ no leaks + ≤${RS.STAR3_TOWER_CAP} towers</div>` : `<div class="starnote">Reached wave ${m.waveIndex} of ${m.maxWaves > 900 ? '∞' : m.maxWaves}</div>`}
          <div class="rewards">
            <div class="rw"><b>${fmt(r.copper)}</b><span>Copper</span></div>
            <div class="rw"><b>${fmt(r.silver)}</b><span>Silver</span></div>
            <div class="rw"><b>${fmt(r.gold)}</b><span>Gold</span></div>
            <div class="rw"><b>${fmt(r.relic)}</b><span>Relics</span></div>
            <div class="rw"><b>${fmt(r.xp)}</b><span>XP</span></div>
          </div>
          ${this._lastLeveled ? `<div class="levelup">⬆ Account Level ${Meta.p.account.level}! ${RS.ACCOUNT.unlocks[Meta.p.account.level] || ''}</div>` : ''}
          <h3>Damage by Tower</h3>
          <div class="dmgchart">
            ${rows.length ? rows.map((row) => `<div class="dmgrow"><span>${row.name}</span><div class="bar"><i style="width:${row.dmg / maxDmg * 100}%"></i></div><em>${fmt(row.dmg)} · ${Math.round(row.dmg / total * 100)}%</em></div>`).join('') : '<em>No damage recorded.</em>'}
          </div>
          <div class="summary-actions">
            <button class="bigbtn" data-go="mapselect">Map Select</button>
            ${won && Meta.diffUnlocked(m.map.id, this._nextDiffId(m.diff)) ? `<button class="bigbtn hl" id="nextTier">Next Tier ▶</button>` : ''}
            <button class="bigbtn" id="replayBtn">Replay</button>
            <button class="bigbtn" data-go="roll">Go Roll 🎲</button>
          </div>
        </div>`;
      this._wireGo();
      const nb = $('#nextTier'); if (nb) nb.onclick = () => { this.selectedDiff = RS.DIFF_BY_ID[this._nextDiffId(m.diff)]; this.workingLoadout = this.workingLoadout.slice(); this.show('loadout'); };
      $('#replayBtn').onclick = () => { this.show('loadout'); };
      this.match = null;
    },
    _nextDiffId(diff) { const order = Math.min(3, diff.order + 1); return RS.DIFFICULTY[order].id; },

    _bindBus() {
      RS.bus.on('boss-spawn', (def) => { if (this.screen === 'match') this.toast('⚠ BOSS: ' + def.name, RS.PALETTE.blood); Meta.seeEnemy(def.id); });
      RS.bus.on('weather-telegraph', (w) => { if (this.screen === 'match') this.toast('Incoming weather: ' + w, RS.PALETTE.frost); });
      RS.bus.on('consume-dup', (id) => Meta.consumeDuplicate(id));
      RS.bus.on('level-up', (lvl) => { if (this.screen === 'match') this.toast('Account Level ' + lvl + '!', RS.PALETTE.gold); });
      RS.bus.on('objective-done', (o) => this.toast('Objective complete: ' + o.desc, RS.PALETTE.good));
    },
  };

  RS.UI = UI;
})();

/* ===== js/main.js ===== */
/* =========================================================================
 * REALM SIEGE — js/main.js
 * Bootstrap: load the persistent profile, init the UI, and run the single
 * requestAnimationFrame loop. Render is decoupled from the fixed-timestep
 * logic (which lives inside Match.frame). Autosaves periodically.
 * ========================================================================= */
(function () {
  'use strict';
  const RS = window.RS;

  function boot() {
    if (!RS || !RS.Meta) { console.error('REALM SIEGE failed to load modules'); return; }
    RS.Meta.load();
    RS.UI.init();

    let last = performance.now();
    let autosave = 0;

    function loop(t) {
      let dt = (t - last) / 1000;
      last = t;
      if (dt > 0.1) dt = 0.1; // clamp after tab-out
      if (RS.UI.screen === 'match' && RS.UI.match) {
        RS.UI.matchTick(dt);
      }
      autosave += dt;
      if (autosave > 20) { autosave = 0; RS.Meta.save(); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Save on exit.
    window.addEventListener('beforeunload', () => RS.Meta.save());
    console.log('REALM SIEGE v1.0 ready — %d towers, %d enemies, %d maps',
      RS.TOWERS.length, RS.ENEMIES.filter((e) => !e.hidden).length, RS.MAPS.length);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
